<head>

<style>

*{box-sizing:border-box}body{margin:0;background:#eef0f1}button{font:inherit;cursor:pointer;color:inherit}button:disabled{cursor:default}button,a{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid #168db0;outline-offset:3px}button{border:0}svg{flex-shrink:0}button svg{width:21px;height:21px}h1,h2,h3,p{margin:0}button:active:not(:disabled){transform:scale(.98)}
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;gap:30px}.phone{position:relative;width:390px;height:min(844px,calc(100dvh - 48px));min-height:560px;background:white;border:7px solid #24343b;border-radius:34px;overflow:hidden;box-shadow:0 22px 55px #182b3325;flex-shrink:0;display:flex;flex-direction:column}.status{height:35px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:9px 19px 4px;font-size:12px;font-weight:700;background:white;z-index:20}.status-right{display:flex;align-items:center;gap:5px}.status-right svg{width:14px;height:14px}.battery{padding:1px 5px;background:var(--ink);color:white;border-radius:4px;font-size:10px}.viewport{flex:1;min-height:0;position:relative;overflow:hidden}.screen{height:100%;overflow-y:auto;scrollbar-width:none;background:#fff}.screen::-webkit-scrollbar{display:none}.homebar{height:18px;flex-shrink:0;background:white;display:grid;place-items:center;z-index:20}.homebar:after{content:"";width:106px;height:4px;border-radius:4px;background:#263940}.header{height:60px;padding:0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:white}.header h1{font-size:19px;font-weight:700;flex:1}.icon{width:36px;height:36px;display:grid;place-items:center;background:transparent;border-radius:50%}.brand{font-size:36px;font-weight:800;color:var(--red)}.small{font-size:12px;color:var(--muted);line-height:1.5}.eyebrow{font-size:12px;font-weight:700;color:var(--red)}.content{padding:22px}.primary{width:100%;min-height:49px;background:var(--red);color:white;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:16px}.primary:disabled{opacity:.65}.secondary{min-height:45px;border:1px solid var(--line);border-radius:8px;background:white;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}.text-button{background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px;min-height:40px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.divider{height:1px;background:var(--line);margin:19px 0}.pill{padding:5px 9px;border-radius:4px;font-size:11px;background:#eef5f2;color:var(--green)}.red-pill{background:var(--soft);color:var(--red)}.footer-note{text-align:center;font-size:10px;color:#879298;margin:12px 0 0;line-height:1.5}
.director{display:flex;flex-direction:column;gap:12px;width:170px}.director .brand{font-size:40px}.director .tag{font-size:11px;color:var(--muted);margin-bottom:15px}.director button{display:flex;gap:10px;align-items:center;background:white;border:1px solid #dce1e3;padding:12px;border-radius:8px;font-size:13px}.director button svg{width:17px}.director .stop{color:var(--red)}.director .label{font-size:11px;color:#7b878c;margin-top:12px}.stage:fullscreen{background:#eef0f1}.stage:fullscreen .director{display:none}.stage:fullscreen .phone{height:min(940px,calc(100dvh - 36px))}
.home{position:relative;background:#f3f4f0}.home-top{position:absolute;top:15px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;z-index:2}.float-icon{background:white;width:43px;height:43px;box-shadow:0 3px 10px #233c3514}.home-map{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.map-label{font-size:11px;fill:#88938b}.home-bottom{position:absolute;bottom:19px;left:16px;right:16px;background:white;padding:17px;border-radius:8px;box-shadow:0 4px 20px #1d35221b}.address-line{display:flex;align-items:center;gap:9px;font-size:14px;margin-bottom:15px}.dot{width:8px;height:8px;background:var(--green);border-radius:50%}.home-surprise{display:flex;align-items:center;gap:10px;position:absolute;top:89px;left:16px;right:16px;background:white;padding:13px;border-radius:8px;box-shadow:0 3px 14px #233c3514;text-align:left}.home-surprise strong{font-size:14px}.home-surprise svg{color:var(--red)}.home-surprise .small{display:block;margin-top:3px}
.scrim{position:absolute;inset:0;background:#0009;z-index:5}.drawer{position:absolute;top:0;bottom:0;left:0;width:82%;background:var(--red);z-index:6;display:flex;flex-direction:column;color:white;animation:slide .25s ease}.drawer-close{align-self:flex-end;color:white;margin:7px 12px 8px}.drawer-close svg{width:31px;height:31px}.drawer-nav{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:space-evenly;padding:0 25px 12px;gap:10px}.drawer-item{font-size:20px;text-align:center;color:white;background:transparent;min-height:30px;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0}.drawer-item.new{font-weight:700;background:#fff2;padding:12px 0;border-radius:7px}.new-label{font-size:9px;background:white;color:var(--red);padding:3px 5px;border-radius:3px}.points{text-align:center;font-size:19px;flex-shrink:0;padding:8px}.points span{display:block;width:95px;margin:7px auto 0;border:1px solid #fff8;border-radius:20px;font-size:15px;padding:5px}.drawer-foot{background:white;color:var(--ink);padding:20px 8px;text-align:center;font-size:16px;display:flex;gap:10px;justify-content:center;align-items:center}.drawer-foot svg{color:var(--red);width:25px}
.photo{width:100%;height:150px;object-fit:cover;display:block}.theme-label{position:absolute;bottom:14px;left:20px;color:white;text-shadow:0 1px 6px #0009}.photo-wrap{position:relative}.theme-label strong{display:block;font-size:23px;margin-top:5px}.photo-wrap:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#0005);pointer-events:none}.theme-label{z-index:1}.daily-intro{padding:19px 22px 12px}.daily-intro h2{font-size:22px;margin:7px 0}.daily-intro p{font-size:13px;color:var(--muted);line-height:1.6}.segmented{display:grid;grid-template-columns:1fr 1fr;background:#f1f3f4;padding:4px;border-radius:8px;margin:18px 0}.segmented button{min-height:45px;border-radius:5px;background:transparent;display:flex;gap:6px;justify-content:center;align-items:center;font-size:14px}.segmented button[aria-pressed=true]{background:white;color:var(--red);font-weight:700;box-shadow:0 1px 5px #22313a12}.mode-note{min-height:42px;font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:17px}.gift-box{border:1px solid #ffd8d0;border-radius:8px;text-align:center;padding:24px;background:#fff9f7;margin:4px 0 18px}.gift-box svg{width:54px;height:54px;color:var(--red);margin-bottom:10px}.gift-box h3{font-size:18px}.gift-box p{font-size:12px;color:var(--muted);margin-top:7px}.loading{height:calc(100% - 60px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:#fff9f7}.loading svg{width:60px;height:60px;color:var(--red);animation:rotate 1.4s linear infinite}.loading h2{font-size:20px}.loading p{font-size:13px;color:var(--muted)}
.result-photo{height:206px;object-position:50% 57%}.result .content{padding:17px 22px}.result h2{font-size:25px;margin:9px 0 8px}.description{font-size:13px;color:var(--muted);line-height:1.6}.facts{display:flex;gap:17px;margin:14px 0;font-size:12px;color:#52666e}.facts span{display:flex;align-items:center;gap:5px}.facts svg{width:15px;height:15px}.reason{font-size:12px;background:#f0f7f5;color:var(--green);padding:11px 12px;display:flex;align-items:flex-start;gap:8px;border-radius:5px;line-height:1.6}.reason svg{width:17px;height:17px;margin-top:1px}.coupon{display:flex;gap:10px;align-items:center;border:1px dashed #f9ada0;border-radius:8px;padding:12px;margin:14px 0;background:#fff8f5}.coupon-amount{color:var(--red);font-size:30px;font-weight:800}.coupon-amount small{font-size:14px}.coupon-info{flex:1;font-size:13px;line-height:1.6}.coupon-info .small{font-size:10px}.claim{background:var(--red);color:white;padding:8px 11px;border-radius:5px;min-width:65px;font-size:12px}.claim.claimed{background:#e4f0eb;color:var(--green)}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.result-actions svg{width:17px;height:17px}.saved{color:var(--red);border-color:#f9c1b9}
.booking-map{height:170px;position:relative;background:#eef4ef;overflow:hidden}.booking-map svg{width:100%;height:100%}.route{stroke:var(--red);stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:8 6;animation:route 2s linear infinite}.trip-addresses{border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:18px}.trip-address{font-size:14px;display:flex;align-items:center;gap:12px;margin:13px 0}.trip-address svg{width:17px;height:17px;color:var(--red)}.car-option{display:flex;align-items:center;gap:13px}.car-icon{background:#fff1ed;color:var(--red);width:57px;height:51px;border-radius:6px;display:grid;place-items:center}.car-icon svg{width:36px;height:36px}.car-name{flex:1}.car-name strong{display:block;font-size:17px}.price{font-size:23px;font-weight:700}.price del{display:block;font-size:12px;color:var(--muted);font-weight:400;text-align:right}.price-lines{font-size:13px;margin:17px 0 23px;display:grid;gap:13px}.price-lines .discount{color:var(--red)}.success-top{text-align:center;padding:29px 20px 20px}.check{width:65px;height:65px;border-radius:50%;background:#e7f4ed;display:grid;place-items:center;margin:0 auto 16px;color:var(--green)}.check svg{width:36px;height:36px}.success-top h2{font-size:23px}.success-top p{font-size:13px;color:var(--muted);margin-top:9px}.driver{padding:16px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}.avatar{width:46px;height:46px;background:#f0f2f3;border-radius:50%;display:grid;place-items:center}.driver strong{font-size:16px}.driver .small{margin-top:4px}.plate{margin-left:auto;font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:5px;padding:7px}.success .booking-map{height:130px}.arrival{margin:18px 0;font-size:13px;line-height:1.8}.arrival strong{color:var(--green);font-size:21px}.toast{position:absolute;bottom:35px;left:22px;right:22px;padding:13px 15px;background:#17313aee;color:white;border-radius:8px;z-index:30;font-size:13px;text-align:center;animation:fade .2s ease;pointer-events:none}.hidden{display:none!important}@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(0)}}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes route{to{stroke-dashoffset:-28}}.screen:not(.home){animation:fade .22s ease}
@media(max-width:650px){.stage{padding:10px;gap:0;flex-direction:column}.phone{width:min(390px,100%);height:calc(100dvh - 75px);min-height:0;border-width:4px;border-radius:22px}.director{width:100%;flex-direction:row;justify-content:center;gap:8px;margin-top:8px}.director>.brand,.director>.tag,.director>.label{display:none}.director button{padding:8px;font-size:11px;gap:5px}.director button svg{width:14px}}

.home-map>svg{width:100%;height:100%}
</style>
</head>
<body>
<main class="stage" id="stage">
  <section class="phone" aria-label="yoxi 每日驚喜手機模擬">
    <div class="status"><span>18:17</span><div class="status-right"><i data-lucide="signal"></i><i data-lucide="wifi"></i><span class="battery">96</span></div></div>
    <div class="viewport" id="viewport"></div>
    <div class="homebar"></div>
  </section>
  <aside class="director" aria-label="錄影控制">
    <div class="brand">yoxi</div><div class="tag">每日驚喜 / CONCEPT DEMO</div>
    <button id="play" title="自動播放展示流程"><i data-lucide="play"></i><span>自動演示</span></button>
    <button id="reset" title="回到紅色選單重新演示"><i data-lucide="rotate-ccw"></i><span>重播</span></button>
    <button id="fullscreen" title="全螢幕，只顯示手機"><i data-lucide="maximize"></i><span>全螢幕</span></button>
    <div class="label">非官方原型 · 不會實際叫車</div>
  </aside>
</main>
<script src="yoxi-assets/lucide.min.js"></script>
<script>
const viewport = document.getElementById('viewport');
const spots = {
  cold: [
    {name:'大稻埕河岸散步道',tag:'冷門探索',distance:'2.4',minutes:12,fare:185,description:'把熟悉的生活圈，換成一段沿河慢走的時光。今晚，留一點時間給自己。',reason:'依你偏好的河岸散步，選一個生活圈裡的新去處。',position:'50% 57%'},
    {name:'五號水門河岸觀景點',tag:'冷門探索',distance:'2.8',minutes:14,fare:200,description:'走過水門，看看城市的另一面。在河岸停一下，讓今天有個不一樣的結尾。',reason:'保留河岸主題，換一個可以輕鬆出發的探索起點。',position:'30% 55%'}
  ],
  hot: [
    {name:'大稻埕碼頭',tag:'熱門精選',distance:'3.1',minutes:15,fare:210,description:'從城市日常走進河岸風景，和朋友一起散步、聊天，收藏今天的夕陽。',reason:'今天的熱門路線：河岸風景與輕鬆散步，一次滿足。',position:'70% 55%'},
    {name:'大稻埕碼頭河岸廣場',tag:'熱門精選',distance:'3.0',minutes:14,fare:205,description:'把目的地設在河岸廣場，一場說走就走的小旅行，就從這裡開始。',reason:'同樣的河岸主題，換成適合相約碰面的出發地。',position:'50% 65%'}
  ]
};
let state, revision = 0, autoTimers = [], toastTimer;
const icon = name => `<i data-lucide="${name}"></i>`;
const selected = () => spots[state.mode][state.index];
function icons(){ if(window.lucide) lucide.createIcons(); }
function header(title, back='daily'){return `<header class="header"><button class="icon" data-action="${back}" aria-label="返回">${icon('arrow-left')}</button><h1>${title}</h1><button class="icon" data-action="home" aria-label="回首頁">${icon('house')}</button></header>`;}
function map(route=false){return `<svg viewBox="0 0 390 650" preserveAspectRatio="xMidYMid slice" aria-label="示意地圖，非真實導航" role="img"><rect width="390" height="650" fill="#edf1eb"/><path d="M0 0H90Q130 110 82 250T56 450T105 650H0Z" fill="#b8dde0"/><g fill="#dee6d8"><rect x="154" y="93" width="59" height="60" rx="4"/><rect x="252" y="161" width="68" height="54" rx="4"/><rect x="135" y="325" width="62" height="68" rx="4"/><rect x="284" y="365" width="85" height="79" rx="4"/><rect x="152" y="504" width="88" height="72" rx="4"/></g><g stroke="white" stroke-width="14" fill="none"><path d="M120 0L100 650M235 0L220 650M335 0L310 650M85 115L390 128M80 259L390 280M65 415L390 448M86 588L390 606"/><path d="M91 335L390 179" stroke-width="20"/></g><g class="map-label"><text x="158" y="249">民生西路</text><text x="249" y="429">南京西路</text><text x="129" y="105">大稻埕</text><text x="23" y="310" transform="rotate(-85 23 310)">淡水河</text></g>${route?'<path class="route" d="M253 368L219 361L224 264L111 258L110 205"/>':''}<circle cx="253" cy="368" r="19" fill="#fff"/><circle cx="253" cy="368" r="8" fill="#f23827"/><circle cx="253" cy="368" r="12" fill="none" stroke="#f23827" stroke-opacity=".3" stroke-width="6"/><g transform="translate(110 201)"><path d="M0 15C-25-14-15-31 0-31S25-14 0 15" fill="#f23827"/><circle cy="-14" r="6" fill="white"/></g></svg>`;}
function home(){return `<div class="screen home"><div class="home-map">${map()}</div><div class="home-top"><button class="icon float-icon" data-action="menu" aria-label="開啟選單">${icon('menu')}</button><span class="brand">yoxi</span><button class="icon float-icon" data-action="notice" aria-label="通知">${icon('bell')}</button></div><button class="home-surprise" data-action="daily">${icon('gift')}<div><strong>今天的每日驚喜已準備好</strong><span class="small">在生活圈，發現沒去過的地方</span></div>${icon('chevron-right')}</button><div class="home-bottom"><div class="address-line"><span class="dot"></span><span>上車地點 · 捷運中山站</span></div><button class="primary" data-action="daily">今天，去哪裡？ ${icon('arrow-right')}</button></div></div>`;}
function drawer(){return `<div class="scrim" data-action="home"></div><nav class="drawer" aria-label="主選單"><button class="icon drawer-close" data-action="home" aria-label="關閉選單">${icon('x')}</button><div class="drawer-nav"><button class="drawer-item new" data-action="daily">每日驚喜 <span class="new-label">NEW</span></button>${['行程紀錄','行程匯出','付款設定','乘車設定'].map(t=>`<span class="drawer-item">${t}</span>`).join('')}<button class="drawer-item" data-action="wallet">優惠券</button>${['好康任務','客服中心','點數商城'].map(t=>`<span class="drawer-item">${t}</span>`).join('')}<div class="points">和泰 Points<span>Ⓟ 0 點</span></div></div><div class="drawer-foot">邀請好友賺搭車金 ${icon('gift')}</div></nav>`;}
function daily(){return `<div class="screen">${header('每日驚喜','menu')}<div class="photo-wrap"><img class="photo" src="yoxi-assets/dadaocheng.jpg" alt="大稻埕河岸風景"><div class="theme-label"><span style="font-size:11px">TODAY'S THEME</span><strong>沿著河岸，慢一點</strong></div></div><div class="daily-intro"><div class="row"><span class="eyebrow">一天一個新發現</span><span class="pill">連續探索 3 天</span></div><h2>今天想遇見什麼？</h2><p>不用遠行，也能找到生活裡的小驚喜。</p><div class="segmented" aria-label="景點偏好"><button data-action="hot" aria-pressed="${state.mode==='hot'}">${icon('flame')}熱門精選</button><button data-action="cold" aria-pressed="${state.mode==='cold'}">${icon('compass')}冷門探索</button></div><p class="mode-note">${state.mode==='cold'?'避開熟悉的選擇，看看生活圈裡的新風景。':'跟著熱門路線，挑一個大家喜歡的出發地。'}</p><div class="gift-box">${icon('gift')}<h3>你的河岸小旅行</h3><p>今日驚喜景點 ＋ 乘車優惠</p></div><button class="primary" data-action="reveal">${icon('sparkles')}揭曉今日驚喜</button><p class="footer-note">每日主題更新 · 景點依你的偏好推薦</p></div></div>`;}
function result(){const s=selected();return `<div class="screen result">${header('今日驚喜')}<img class="photo result-photo" style="object-position:${s.position}" src="yoxi-assets/dadaocheng.jpg" alt="大稻埕河岸風景"><div class="content"><div class="row"><span class="eyebrow">你的今日目的地</span><span class="pill red-pill">${s.tag}</span></div><h2>${s.name}</h2><p class="description">${s.description}</p><div class="facts"><span>${icon('map-pin')}約 ${s.distance} 公里</span><span>${icon('car-front')}車程約 ${s.minutes} 分鐘</span></div><div class="reason">${icon('sparkles')}<span>${s.reason}</span></div>${coupon()}<div class="result-actions"><button class="secondary" data-action="swap">${icon('shuffle')}換一個</button><button class="secondary ${state.saved?'saved':''}" data-action="save">${icon('heart')}${state.saved?'已收藏':'先收藏'}</button></div><button class="primary" data-action="booking">${icon('car-front')}出發去這裡</button><p class="footer-note"><a href="https://commons.wikimedia.org/wiki/File:Dadaocheng_Riverside_at_Sunset_20220711.jpg" target="_blank" rel="noopener" style="color:inherit">照片：臺北市政府／Wikimedia Commons</a></p></div></div>`;}
function coupon(){return `<div class="coupon"><div class="coupon-amount"><small>$</small>50</div><div class="coupon-info"><strong>每日驚喜乘車券</strong><div class="small">今日有效 · 示範優惠</div></div><button class="claim ${state.claimed?'claimed':''}" data-action="claim" ${state.claimed?'disabled':''}>${state.claimed?'已領取':'領取'}</button></div>`;}
function booking(){const s=selected(),discount=state.claimed?50:0;return `<div class="screen">${header('確認行程','result')}<div class="booking-map">${map(true)}</div><div class="content"><div class="trip-addresses"><div class="trip-address"><span class="dot"></span>捷運中山站 · 出口旁</div><div class="trip-address">${icon('map-pin')}${s.name}</div></div><div class="car-option"><div class="car-icon">${icon('car-front')}</div><div class="car-name"><strong>yoxi 小黃</strong><span class="small">4 人座 · 約 3 分鐘抵達</span></div><div class="price">$${s.fare-discount}${discount?`<del>$${s.fare}</del>`:''}</div></div><div class="divider"></div><div class="price-lines"><div class="row"><span>預估車資</span><span>$${s.fare}</span></div><div class="row discount"><span>每日驚喜乘車券</span><span>${discount?'− $50':'尚未領取'}</span></div><div class="row"><span>付款方式</span><span>現金</span></div></div>${!state.claimed?`<button class="secondary" data-action="claim" style="width:100%;margin-bottom:12px">領取 $50 優惠</button>`:''}<button class="primary" data-action="request">${icon('car-front')}確認叫車</button><p class="footer-note">模擬行程 · 車資、距離與到車時間皆為示範</p></div></div>`;}
function success(){const s=selected();return `<div class="screen success">${header('行程已確認','result')}<div class="success-top"><div class="check">${icon('check')}</div><h2>司機已接單，準備出發！</h2><p>從每日驚喜，到真的想去的地方。</p></div><div class="booking-map">${map(true)}</div><div class="content"><div class="driver"><div class="avatar">${icon('user-round')}</div><div><strong>示範司機</strong><p class="small">★ 4.9 · yoxi 小黃</p></div><span class="plate">DEMO</span></div><div class="arrival"><div class="row"><span>預計抵達上車點</span><strong>3 分鐘</strong></div><div class="row"><span>目的地</span><span>${s.name}</span></div><div class="row"><span>預估應付</span><b>$${s.fare-(state.claimed?50:0)}</b></div></div><button class="primary" data-action="home">回首頁</button><p class="footer-note">展示完成 · 此頁不會發出真實叫車訂單</p></div></div>`;}
function render(){revision++;const views={home,menu:()=>home()+drawer(),daily,result,booking,success,wallet:()=>`<div class="screen">${header('優惠券','menu')}<div class="content"><h2 style="font-size:21px;margin-bottom:20px">我的乘車優惠</h2>${coupon()}<button class="primary" data-action="daily">探索今日驚喜 ${icon('arrow-right')}</button></div></div>`,loading:()=>`${header('每日驚喜')}<div class="loading">${icon('sparkles')}<h2>正在尋找你的今日驚喜…</h2><p>河岸風景，就在生活圈裡。</p></div>`,matching:()=>`${header('媒合司機','booking')}<div class="loading">${icon('loader-circle')}<h2>正在為你尋找司機…</h2><p>將每日驚喜，變成一趟小旅行。</p></div>`};viewport.innerHTML=views[state.view]();icons();}
function show(view){state.view=view;render();}
function toast(message){clearTimeout(toastTimer);viewport.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;viewport.append(el);toastTimer=setTimeout(()=>el.remove(),2400);}
function delayed(from,to,ms){show(from);const token=revision;setTimeout(()=>{if(revision===token)show(to);},ms);}
function stopAuto(){autoTimers.forEach(clearTimeout);autoTimers=[];document.getElementById('play').classList.remove('stop');document.getElementById('play').innerHTML=icon('play')+'<span>自動演示</span>';icons();}
function reset(){stopAuto();clearTimeout(toastTimer);state={view:'menu',mode:'cold',index:0,claimed:false,saved:false};render();}
function action(name){switch(name){case'menu':case'home':case'daily':case'result':case'booking':case'wallet':show(name);break;case'hot':case'cold':state.mode=name;state.index=0;state.saved=false;show('daily');break;case'reveal':delayed('loading','result',1150);break;case'swap':state.index=(state.index+1)%spots[state.mode].length;state.saved=false;delayed('loading','result',800);break;case'claim':if(state.claimed)return;state.claimed=true;render();toast('$50 乘車券已加入你的優惠券');break;case'save':state.saved=!state.saved;render();toast(state.saved?'已收藏，隨時回來出發':'已取消收藏');break;case'request':delayed('matching','success',1600);break;case'notice':toast('今天的每日驚喜已準備好');break;}}
viewport.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;stopAuto();action(button.dataset.action);});
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('play').addEventListener('click',()=>{if(autoTimers.length){stopAuto();return;}reset();const steps=[[1800,'daily'],[4800,'hot'],[7200,'cold'],[10500,'reveal'],[15600,'claim'],[19600,'save'],[22800,'booking'],[27800,'request']];autoTimers=steps.map(([ms,name])=>setTimeout(()=>action(name),ms));autoTimers.push(setTimeout(stopAuto,33000));document.getElementById('play').classList.add('stop');document.getElementById('play').innerHTML=icon('square')+'<span>停止演示</span>';icons();});
document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.getElementById('stage').requestFullscreen();}catch{toast('瀏覽器未能開啟全螢幕');}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!document.fullscreenElement){stopAuto();show('home');}});
// shortcut: in-memory demo state permits repeat filming; production needs real daily limits, recommendation data and booking APIs.
reset();
</script>
</body>
</html>
